# Banco de dados de DESENVOLVIMENTO. Em produção, use um Postgres gerenciado
# e configure DATABASE_URL na hospedagem.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lojaprontaprime
      POSTGRES_PASSWORD: lojaprontaprime
      POSTGRES_DB: lojaprontaprime
    ports:
      # A senha local é pública no repositório: o banco não pode ficar aberto para a rede.
      - '127.0.0.1:5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lojaprontaprime -d lojaprontaprime']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
